# 推送到 GitHub 后自动构建并部署到 GitHub Pages。
# 启用方法：仓库 Settings → Pages → Build and deployment → Source 选 GitHub Actions。
name: 构建并部署站点

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 启用 / 配置 GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 安装 MkDocs Material
        run: pip install mkdocs-material==9.7.6

      - name: 准备 PDF / Word 并构建
        run: |
          mkdir -p docs/弹性力学/pdf docs/流体力学/pdf docs/振动力学/pdf
          cp 弹性力学/*.pdf 弹性力学/*.docx docs/弹性力学/pdf/
          cp 弹性力学/分章节/*.pdf docs/弹性力学/pdf/
          cp 流体力学/*.pdf 流体力学/*.docx docs/流体力学/pdf/
          cp 流体力学/分章节/*.pdf docs/流体力学/pdf/
          cp 振动力学/*.pdf 振动力学/*.docx docs/振动力学/pdf/
          cp 振动力学/分章节/*.pdf docs/振动力学/pdf/
          mkdocs build --clean

      - name: 加密站点
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "缺少 STATICRYPT_PASSWORD Secret，无法加密站点" >&2
            exit 1
          fi
          npx --yes staticrypt@3.5.4 site -r -d site_enc \
            -p "$STATICRYPT_PASSWORD" --remember 30 --short \
            -t 方法与工具/staticrypt_template.html \
            --template-title '知枢' \
            --template-instructions '请输入访问密码' \
            --template-placeholder '密码' \
            --template-button '进入' \
            --template-remember '30 天内记住我' \
            --template-error '密码不对，请重试' \
            --template-toggle-show '显示密码' \
            --template-toggle-hide '隐藏密码' \
            --template-color-primary '#2f5d50' \
            --template-color-secondary '#f8f7f3'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site_enc/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
